[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-watcher"
version = "0.1.0"
description = "Interview control plane — interview creation and AI-generated interviewer expectations"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
    "License :: Other/Proprietary License",
    # Makes PyPI reject an upload outright. This code is not for distribution,
    # and a stray `twine upload` should fail loudly rather than publish it.
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.package-data]
# The agent reads its instructions at runtime, so they ship with the package.
analysis_agent = ["INSTRUCTIONS.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["control_plane*", "expectation_agent*", "report_engine*", "analysis_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
# okf/ and docs/ hold prose, not source. Their fenced Python blocks are aligned
# for reading (dependency maps, struct sketches with trailing comments); ruff
# would reformat them into something correct and less legible.
exclude = [".venv", "ui", "okf", "docs"]

[tool.ruff.lint]
# Explicit rule set — the project standard, not whatever the ruff default drifts to.
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # import order
    "N",           # pep8-naming
    "UP",          # pyupgrade — py311 idioms
    "B",           # bugbear
    "C4",          # comprehensions
    "SIM",         # simplify
    "RET",         # return consistency
    "ARG",         # unused arguments
    "PTH",         # pathlib over os.path
    "TID",         # tidy imports (bans relative imports)
    "RUF",         # ruff-specific
    "ANN",         # annotations — public API must be typed
    "D",           # docstrings
]
ignore = [
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "D401",    # imperative mood — too rigid for domain docstrings
    "ANN401",  # Any is legitimate for model payloads
    "D107",    # __init__ documented on the class
]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Query() defaults are the framework's calling convention.
"control_plane/api.py" = ["B008"]
# Tests document themselves through names; scripts are entrypoints.
"tests/*" = ["D100", "D101", "D102", "D103", "ANN", "ARG"]
"scripts/*" = ["D103", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
files = [
    "control_plane",
    "expectation_agent",
    "candidate_agent",
    "evaluation_agent",
    "analysis_agent",
    "report_engine",
    "llm",
]
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
# Third-party packages without bundled stubs.
module = ["google.*", "openai.*", "dotenv.*"]
ignore_missing_imports = true
